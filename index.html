<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#fff6fb" />
<title>合成大西瓜 · 梗图版</title>
<style>
  /* ============================================================
     合成大西瓜 —— 单文件小游戏
     纯 HTML + CSS + JavaScript，无任何外部图片 / 字体 / 第三方库
     ============================================================ */
  :root{
    --ink:#4a3b52;
    --ink-soft:#93859c;
    --pink:#ff7fa8;
    --mint:#57cfa0;
    --card:#ffffff;
    --r-lg:22px;
    --shadow-sm:0 2px 6px rgba(126,96,140,.10);
    --shadow-md:0 10px 24px rgba(126,96,140,.16);
    --shadow-lg:0 18px 40px rgba(126,96,140,.22);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 560px at 10% -12%, #ffe7f1 0%, rgba(255,231,241,0) 58%),
      radial-gradient(900px 520px at 92% -6%, #e3f5ff 0%, rgba(227,245,255,0) 55%),
      radial-gradient(900px 640px at 50% 118%, #e6fff4 0%, rgba(230,255,244,0) 62%),
      linear-gradient(180deg,#fdf8ff 0%,#f3f8ff 52%,#f5fffb 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .app{
    display:flex; flex-direction:column; align-items:center;
    gap:10px; padding:10px;
  }

  /* ---------- 顶部 HUD ---------- */
  .hud{
    width:100%;
    display:flex; align-items:center; gap:8px;
    justify-content:space-between;
  }
  .chip{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    min-width:88px;
    padding:6px 14px;
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow-sm), inset 0 0 0 2px #fff;
    border:2px solid #ffe6f0;
  }
  .chip .label{
    font-size:11px; letter-spacing:.12em; color:var(--ink-soft); line-height:1.1;
  }
  .chip .value{
    font-size:22px; font-weight:800; line-height:1.15;
    font-variant-numeric:tabular-nums;
    color:#5b4767;
  }
  .chip.best{ border-color:#dff3ff; }
  .chip.best .value{ color:#3f92c8; }
  .chip .value.bump{ animation:bump .3s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump{ 0%{transform:scale(1)} 42%{transform:scale(1.3)} 100%{transform:scale(1)} }

  .hud-actions{ display:flex; align-items:center; gap:8px; }
  button{
    font-family:inherit; color:inherit; cursor:pointer;
    border:none; outline:none;
  }
  button:focus-visible{
    outline:3px solid rgba(255,127,168,.6);
    outline-offset:2px;
  }
  .icon-btn{
    width:40px; height:40px; border-radius:14px;
    font-size:19px; line-height:1;
    background:var(--card);
    box-shadow:var(--shadow-sm);
    border:2px solid #ffe6f0;
    transition:transform .12s ease, filter .2s ease;
  }
  .icon-btn:active{ transform:scale(.93); }
  .icon-btn.off{ filter:grayscale(1); opacity:.55; }
  .text-btn{
    padding:0 18px; height:40px;
    border-radius:14px;
    font-size:15px; font-weight:700; letter-spacing:.06em;
    color:#fff;
    background:linear-gradient(180deg,#ff9dbe 0%, #ff7fa8 100%);
    box-shadow:0 6px 14px rgba(255,127,168,.38), inset 0 -2px 0 rgba(0,0,0,.06);
    transition:transform .12s ease, box-shadow .2s ease;
  }
  .text-btn:hover{ filter:brightness(1.04); }
  .text-btn:active{ transform:translateY(2px) scale(.98); box-shadow:0 3px 8px rgba(255,127,168,.34); }
  .text-btn.big{ height:52px; padding:0 34px; font-size:17px; border-radius:18px; }

  /* ---------- 游戏区 ---------- */
  .stage{
    --w: min(92vw, 420px, max(210px, calc((100vh - 232px) * 0.6667)));
    position:relative;
    width:var(--w);
    height:calc(var(--w) * 1.5);
    border-radius:26px;
    border:3px solid #ffe4ef;
    background:linear-gradient(180deg,#fffdf7 0%, #fff6fb 42%, #eef8ff 100%);
    box-shadow:var(--shadow-md), inset 0 0 0 3px #fff;
    overflow:hidden;
    touch-action:none;
    cursor:pointer;
  }
  .stage.shake{ animation:shake .5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px) }
    20%,80%{ transform:translateX(3px) }
    30%,50%,70%{ transform:translateX(-5px) }
    40%,60%{ transform:translateX(5px) }
  }
  canvas{ display:block; width:100%; height:100%; }

  .badge{
    position:absolute; top:10px; right:10px;
    display:flex; align-items:center; gap:6px;
    padding:5px 12px 5px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.86);
    box-shadow:var(--shadow-sm);
    font-size:12px; letter-spacing:.08em; color:var(--ink-soft);
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .badge.dim{ opacity:.18; }
  .badge .next-img{ width:20px; height:20px; object-fit:contain; display:block; }
  .badge .next-img.pop{ animation:bump .32s cubic-bezier(.2,1.6,.4,1); }

  .hint{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    padding:7px 16px; border-radius:999px;
    background:rgba(255,255,255,.9);
    box-shadow:var(--shadow-sm);
    font-size:12.5px; letter-spacing:.06em; color:var(--ink-soft);
    pointer-events:none;
    animation:floaty 2.4s ease-in-out infinite;
    transition:opacity .4s ease, transform .4s ease;
  }
  .hint.hide{ opacity:0; transform:translateX(-50%) translateY(8px); }
  @keyframes floaty{ 0%,100%{ margin-bottom:0 } 50%{ margin-bottom:6px } }

  /* ---------- 结束面板 ---------- */
  .gameover{
    position:absolute; inset:0;
    display:grid; place-items:center;
    background:rgba(255,250,252,.74);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
    z-index:5;
  }
  .gameover.show{ opacity:1; pointer-events:auto; }
  .panel{
    width:78%; max-width:300px;
    padding:22px 20px 20px;
    text-align:center;
    background:var(--card);
    border-radius:var(--r-lg);
    border:3px solid #ffe6f0;
    box-shadow:var(--shadow-lg);
    transform:translateY(12px) scale(.94);
    transition:transform .34s cubic-bezier(.2,1.5,.45,1);
  }
  .gameover.show .panel{ transform:none; }
  .panel .over-img{
    width:74px; height:74px; object-fit:contain;
    display:block; margin:0 auto;
    filter:drop-shadow(0 6px 10px rgba(126,96,140,.22));
    animation:floaty 2s ease-in-out infinite;
  }
  .panel h1{ margin:6px 0 6px; font-size:20px; letter-spacing:.08em; }
  .panel p{ margin:4px 0; font-size:14px; color:var(--ink-soft); }
  .panel p b{ font-size:20px; color:var(--pink); font-variant-numeric:tabular-nums; }
  .panel .record{ min-height:20px; font-size:13px; color:#f0a03c; font-weight:700; }
  .panel .text-btn{ margin-top:14px; }

  /* ---------- 赞助（爱发电） ---------- */
  /* 结算面板里的赞助标语 + 明显可点的超链接 */
  .sponsor-card{
    margin-top:16px; padding:12px 12px 10px;
    border-radius:16px;
    background:linear-gradient(180deg,#fff6fa 0%,#ffe9f3 100%);
    border:2px dashed #ffc3d9;
  }
  .sponsor-slogan{
    font-size:13.5px; font-weight:800; line-height:1.35;
    color:#e0557f; letter-spacing:.01em;
  }
  a.sponsor-btn{
    display:block; margin:9px auto 7px;
    padding:9px 14px; border-radius:12px;
    font-size:13.5px; font-weight:700; text-decoration:none;
    color:#fff;
    background:linear-gradient(180deg,#ff9dbe 0%,#ff7fa8 100%);
    box-shadow:0 5px 12px rgba(255,127,168,.34);
    transition:transform .12s ease, filter .18s ease;
  }
  a.sponsor-btn:hover{ filter:brightness(1.05); }
  a.sponsor-btn:active{ transform:translateY(1px) scale(.98); }
  a.sponsor-url{
    display:inline-block;
    font-size:11.5px; letter-spacing:.01em;
    color:#3b82c4;                 /* 经典链接蓝，一眼看出能点 */
    text-decoration:underline;
    text-underline-offset:2px;
    word-break:break-all;
    transition:color .16s ease;
  }
  a.sponsor-url:hover{ color:#1f5f9c; }
  a.sponsor-url:visited{ color:#7b6bb5; }

  .foot{ display:flex; flex-direction:column; align-items:center; gap:7px; }
  a.sponsor-link{
    font-size:12px; letter-spacing:.03em; line-height:1.5;
    color:#c86f95; text-decoration:none;
    padding:6px 14px; border-radius:999px;
    background:rgba(255,255,255,.78);
    border:1.5px dashed #ffc9dd;
    transition:color .18s ease, border-color .18s ease, transform .12s ease, box-shadow .18s ease;
  }
  a.sponsor-link u{ text-decoration-color:#ff9dbe; text-underline-offset:2px; }
  a.sponsor-link:hover{ color:#e2648d; border-color:#ff9dbe; box-shadow:0 4px 12px rgba(255,127,168,.18); }
  a.sponsor-link:hover u{ text-decoration-color:#e2648d; }
  a.sponsor-link:active{ transform:scale(.97); }

  /* ---------- 底部进化链 ---------- */
  .chain{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:1px; max-width:min(92vw, 460px);
    line-height:1;
    opacity:.9;
  }
  .chain img{ width:24px; height:24px; object-fit:contain; display:block; }
  .chain .arrow{ font-size:11px; color:#c9bdd2; margin:0 1px; }
  @media (max-height:700px){ .chain{ display:none; } }
  @media (max-height:600px){ .sponsor-link{ font-size:11px; padding:3px 10px; } }
  @media (max-width:360px){ .chip{ min-width:76px; padding:5px 10px; } .chip .value{ font-size:19px; } }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="chip score">
      <span class="label">分数</span>
      <span class="value" id="scoreValue">0</span>
    </div>
    <div class="chip best">
      <span class="label">最高分</span>
      <span class="value" id="bestValue">0</span>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">🔊</button>
      <button class="text-btn" id="restartBtn">重开</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" width="400" height="600"></canvas>
    <div class="badge">下一个 <img class="next-img" id="nextSprite" alt="" /></div>
    <div class="hint" id="hint">移动瞄准 · 点击掉落</div>
    <div class="gameover" id="gameover">
      <div class="panel">
        <img class="over-img" id="overSprite" alt="" />
        <h1>游戏结束</h1>
        <p>本局得分 <b id="finalScore">0</b></p>
        <p class="record" id="recordLine"></p>
        <button class="text-btn big" id="againBtn">再来一局</button>
        <div class="sponsor-card">
          <div class="sponsor-slogan">🧋 觉得好玩？请作者喝杯奶茶吧！</div>
          <a class="sponsor-btn" id="sponsorPanel" href="https://afdian.com/a/8093a" target="_blank" rel="noopener noreferrer">☕ 点我赞助 · 爱发电</a>
          <a class="sponsor-url" href="https://afdian.com/a/8093a" target="_blank" rel="noopener noreferrer">https://afdian.com/a/8093a</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">
    <div class="chain" id="chain" aria-hidden="true"></div>
    <a class="sponsor-link" id="sponsorFoot" href="https://afdian.com/a/8093a" target="_blank" rel="noopener noreferrer">
      🧋 觉得好玩？<u>点这里请作者一杯奶茶</u> · <u>https://afdian.com/a/8093a</u>
    </a>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     1. 常量与配置
     ============================================================ */
  const W = 400;                 // 逻辑画布宽
  const H = 600;                 // 逻辑画布高
  const DEATH_Y = 96;            // 顶部危险线（虚线）
  const DROP_PAD = 8;            // 掉落点距顶部的距离
  const GRAVITY = 2150;          // 重力加速度 px/s²
  const DT = 1 / 180;            // 固定物理步长（秒）
  const MAX_STEPS = 10;          // 单帧最多物理步数（防止卡顿后爆炸）
  const SOLVER_ITER = 5;         // 每步约束求解迭代次数
  const RESTITUTION = 0.34;      // 弹性系数（碰撞时“弹一下”的手感）
  const REST_THRESHOLD = 26;     // 高于该接近速度才真正反弹（低速不弹，保证堆叠稳定）
  const SQUASH_GAIN = 0.17;      // 撞击挤压幅度（视觉弹性）
  const SQUASH_SPEED = 7.5;      // 挤压回弹速度（越大回弹越快）
  const FRICTION = 0.36;         // 摩擦系数
  const AIR_DRAG = 0.30;         // 空气阻力
  const ANGULAR_DAMP = 1.5;      // 角速度阻尼
  const SLOP = 0.35;             // 允许的微小穿透（px）
  const CORRECTION = 0.78;       // 位置修正比例
  const REST_SPEED = 13;         // 判定为“静止”的速度阈值
  const MAX_CORRECTION = 6;      // 单次位置修正上限（px）：深重叠时防止把果实“泵”出容器
  const MAX_SPEED = 2200;        // 速度上限，杜绝穿透
  const CEILING = -20;           // 顶部软天花板（掉落口在更下方，不冲突）
  const GRACE = 0.55;            // 新掉落果实多久后开始计入越线
  const DANGER_LIMIT = 1.6;      // 越线持续多久判定失败（秒）
  const DROP_COOLDOWN = 0.28;    // 掉落冷却
  const OVER_SETTLE = 1.8;       // 结束后余韵物理的持续时间（秒），之后彻底停机
  const SPAWN_MAX = 4;           // 可掉落的最小果实最大索引（0..4，共 5 种）
  const BONUS_WATERMELON = 100;  // 两个西瓜相撞的奖励分

  // 进化链：10 级，图片已内嵌成 base64（见文件末尾 __SUIKA_SPRITES），
  // c = 该图的视觉主色（粒子/波纹/瞄准线用），l = 提亮版（占位与点缀用）
  const FRUITS = [
    { n:'蘑菇雪茄', c:'#8e6c64', l:'#f2e7e2', r:13 },
    { n:'爱因斯坦', c:'#737273', l:'#e6e5e5', r:18 },
    { n:'长下巴笑', c:'#8a8a8b', l:'#ebebeb', r:24 },
    { n:'蓝T恤', c:'#56656e', l:'#dde4e7', r:30 },
    { n:'求收养', c:'#9b7558', l:'#f0e3da', r:37 },
    { n:'猫猫兵', c:'#989799', l:'#f0efef', r:44 },
    { n:'兔子玩偶', c:'#898788', l:'#eae9e9', r:52 },
    { n:'剪刀手', c:'#6c6969', l:'#e4e3e3', r:60 },
    { n:'指指点点', c:'#7c6d64', l:'#eae4e0', r:69 },
    { n:'飞踢', c:'#626061', l:'#e1e0e0', r:78 }
  ];
  const MAX_LEVEL = FRUITS.length - 1;
  // 合成出第 i 级果实的得分（三角数，越大的越值钱）
  const POINTS = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45];
  const TAU = Math.PI * 2;
  const SPRITE_FIT = 1.15;       // 贴纸外接方框 = 2r * FIT，与烘焙脚本一致
  const TILT = 0.42;             // 贴纸最大倾斜角（弧度），让人物基本保持直立

  /* ============================================================
     2. 小工具
     ============================================================ */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const randLevel = () => Math.floor(Math.random() * (SPAWN_MAX + 1));   // 0..SPAWN_MAX

  // 把角度收敛到 ±TILT：贴纸人物不做整圈翻滚，保持可辨认
  function displayAngle(a) {
    let t = a % TAU;
    if (t > Math.PI) t -= TAU;
    else if (t < -Math.PI) t += TAU;
    return clamp(t, -TILT, TILT);
  }

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } }
  };
  const KEY_BEST = 'suika.best';
  const KEY_MUTE = 'suika.muted';

  /* ============================================================
     3. 音效（WebAudio 合成，无外部音频文件）
     ============================================================ */
  const Sound = (function () {
    let ac = null;
    let muted = store.get(KEY_MUTE, '0') === '1';

    function ctx() {
      if (muted) return null;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!ac) { try { ac = new AC(); } catch (e) { return null; } }
      if (ac.state === 'suspended' && ac.resume) ac.resume();
      return ac;
    }
    function blip(freq, dur, type, vol, delay) {
      const a = ctx(); if (!a) return;
      const t0 = a.currentTime + (delay || 0);
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain); gain.connect(a.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    function sweep(f1, f2, dur, vol) {
      const a = ctx(); if (!a) return;
      const t0 = a.currentTime;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t0 + dur);
      gain.gain.setValueAtTime(vol || 0.12, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain); gain.connect(a.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

    // ---- 合成音效：内嵌采样（来自玩家提供的视频，取其中一次击发） ----
    let sample = null;          // 解码后的 AudioBuffer
    let sampleTried = false;
    let liveVoices = 0;         // 同时播放的路数（连锁合成时避免糊成一片）

    function b64ToBuffer(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }
    function loadSample() {
      const a = ctx();
      if (!a || sample || sampleTried) return;
      const url = window.__SUIKA_MERGE_SFX;
      if (!url) return;
      sampleTried = true;
      const raw = url.indexOf(',') >= 0 ? url.slice(url.indexOf(',') + 1) : url;
      const buf = b64ToBuffer(raw);
      const done = b => { sample = b; };
      const p = a.decodeAudioData(buf, done, () => { sampleTried = false; });
      if (p && p.then) p.then(done).catch(() => { sampleTried = false; });
    }
    function playSample(rate, vol) {
      const a = ctx();
      if (!a || !sample) return false;
      if (liveVoices >= 2) return true;           // 连锁合成时最多两路叠加
      const src = a.createBufferSource();
      const gain = a.createGain();
      src.buffer = sample;
      src.playbackRate.value = rate;
      gain.gain.value = vol;
      src.connect(gain); gain.connect(a.destination);
      liveVoices++;
      src.onended = () => { liveVoices = Math.max(0, liveVoices - 1); };
      src.start();
      return true;
    }

    return {
      play(name, level) {
        if (muted) return;
        const lv = level || 0;
        if (name === 'drop') { blip(320, 0.08, 'triangle', 0.07); }
        else if (name === 'merge') {
          // 完整播放视频里的那段音效（三次击发全保留，原速不变调）
          if (!playSample(1.0, 0.52)) {          // 采样还没解码完时先用合成音兜底
            const base = 420 * Math.pow(1.09, lv);
            blip(base, 0.16, 'sine', 0.11);
            blip(base * 1.5, 0.14, 'sine', 0.05, 0.03);
          }
        } else if (name === 'boom') {
          if (!playSample(0.82, 0.62)) {
            sweep(880, 160, 0.5, 0.14);
            [660, 880, 1180].forEach((f, i) => blip(f, 0.22, 'triangle', 0.09, i * 0.08));
          }
        } else if (name === 'over') {
          sweep(520, 120, 0.75, 0.13);
          [440, 350, 260].forEach((f, i) => blip(f, 0.3, 'triangle', 0.07, i * 0.13));
        }
      },
      unlock() { ctx(); loadSample(); },
      isMuted() { return muted; },
      toggle() {
        muted = !muted;
        store.set(KEY_MUTE, muted ? '1' : '0');
        if (!muted) { ctx(); loadSample(); blip(660, 0.12, 'sine', 0.1); }
        return muted;
      },
      // 供自动化测试确认采样状态
      sampleState() { return { loaded: !!sample, duration: sample ? +sample.duration.toFixed(3) : 0, tried: sampleTried }; }
    };
  })();

  /* ============================================================
     4. 画布初始化
     ============================================================ */
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: true });
  let renderScale = 1;     // 逻辑坐标 -> 物理像素（背景缓存采样用）
  let bgCache = null;      // 静态背景缓存（尺寸变化时失效）

  function resize() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    // 两轴缩放比略有差异，取较大者作为缓存采样率，避免纵向被降采样
    renderScale = Math.max(canvas.width / W, canvas.height / H);
    // 逻辑坐标 (400x600) 映射到实际像素，两个方向分别缩放，保证铺满且不变形
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    bgCache = null;        // 背景缓存失效，下一帧重建
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  // 跨屏拖动窗口时 devicePixelRatio 可能变化而不触发 resize：用 matchMedia 兜底
  function watchPixelRatio() {
    if (!window.matchMedia) return;
    try {
      const mq = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
      const onChange = () => { resize(); watchPixelRatio(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange, { once: true });
      else if (mq.addListener) {
        const legacy = () => { mq.removeListener(legacy); onChange(); };
        mq.addListener(legacy);
      }
    } catch (e) { /* 不支持则忽略 */ }
  }
  watchPixelRatio();

  // 贴纸图片：data URI 预加载，解码完成后直接 drawImage（不再走 fillText emoji）
  const spriteSrc = (window.__SUIKA_SPRITES || {});
  const spriteImgs = FRUITS.map((f, i) => {
    const im = new Image();
    im.decoding = 'async';
    if (spriteSrc[i]) im.src = spriteSrc[i];
    return im;
  });
  function spriteReady(level) {
    const im = spriteImgs[level];
    return !!(im && im.complete && im.naturalWidth > 0);
  }
  // 给 HTML 里的 <img>（下一个预览、进化链、结算面板）用
  function spriteURL(level) { return spriteSrc[level] || ''; }

  /* ============================================================
     5. 物理世界
     ============================================================ */
  let balls = [];          // 所有果实
  let mergeQueue = [];     // 本步待合成的一对
  let particles = [];      // 果汁粒子
  let ripples = [];        // 合成波纹
  let floats = [];         // 飘分文字

  function makeBall(x, y, level, vx, vy) {
    const f = FRUITS[level];
    const mass = f.r * f.r;                      // 质量 ∝ 面积
    return {
      x, y, vx: vx || 0, vy: vy || 0,
      r: f.r, level, mass, invMass: 1 / mass,
      angle: rand(0, TAU), omega: 0,
      age: 0, dead: false, pop: 0,
      cnx: 0, cny: 0, touching: false,
      restT: 0, glow: 0,
      squash: 0, snx: 0, sny: 1        // 撞击挤压的方向与强度（视觉弹性）
    };
  }

  // 记录一次撞击用于挤压效果：dir 为“推向该果实”的法线方向
  function addImpact(b, dirx, diry, dv) {
    if (dv < 55) return;                       // 轻微接触不做形变
    const k = Math.min(1, (dv - 55) / 420);
    if (k > b.squash) { b.squash = k; b.snx = dirx; b.sny = diry; }
  }

  function queueMerge(a, b) {
    a.dead = true; b.dead = true;
    mergeQueue.push([a, b]);
  }

  // ---- 与墙壁/地面碰撞（无限质量） ----
  function hitWall(b, nx, ny, pen) {
    b.x += nx * pen;
    b.y += ny * pen;
    // 接触法线（由球心指向接触点）
    b.cnx -= nx; b.cny -= ny; b.touching = true;

    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return;
    const e = (-vn > REST_THRESHOLD) ? RESTITUTION : 0;
    const jn = -(1 + e) * vn * b.mass;
    b.vx += jn * nx * b.invMass;
    b.vy += jn * ny * b.invMass;
    // 撞墙/落地也挤一下：方向为“推向自己”的反法线
    addImpact(b, -nx, -ny, jn * b.invMass);

    // 切向摩擦
    const tx = -ny, ty = nx;
    const vt = b.vx * tx + b.vy * ty;
    let jt = -vt * b.mass;
    const maxF = FRICTION * Math.abs(jn);
    if (jt > maxF) jt = maxF; else if (jt < -maxF) jt = -maxF;
    b.vx += jt * tx * b.invMass;
    b.vy += jt * ty * b.invMass;
  }

  function collideWalls(b) {
    if (b.x - b.r < 0) hitWall(b, 1, 0, b.r - b.x);
    if (b.x + b.r > W) hitWall(b, -1, 0, b.x + b.r - W);
    if (b.y + b.r > H) hitWall(b, 0, -1, b.y + b.r - H);
    if (b.y - b.r < CEILING) hitWall(b, 0, 1, CEILING - (b.y - b.r));
  }

  // ---- 果实之间碰撞 ----
  function collidePair(a, b, allowMerge) {
    // 已被本步合成消耗掉的果实立即退出：否则同一颗粒子可能在一次迭代里
    // 被重复计入多次合成（三方重叠时会凭空多合一个果实、多加一次分）
    if (a.dead || b.dead) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const rsum = a.r + b.r;
    const d2 = dx * dx + dy * dy;
    if (d2 >= rsum * rsum) return;

    let d = Math.sqrt(d2), nx, ny;
    if (d < 1e-6) { nx = 0; ny = -1; d = 1e-6; }
    else { nx = dx / d; ny = dy / d; }

    // 同级相撞 → 合成
    if (allowMerge && a.level === b.level) { queueMerge(a, b); return; }

    const pen = rsum - d;
    const invSum = a.invMass + b.invMass;

    // 位置修正：把重叠推开（单次修正设上限，避免深重叠时把果实弹飞）
    let corr = Math.min(Math.max(pen - SLOP, 0) * CORRECTION, MAX_CORRECTION) / invSum;
    a.x -= nx * corr * a.invMass; a.y -= ny * corr * a.invMass;
    b.x += nx * corr * b.invMass; b.y += ny * corr * b.invMass;

    // 记录接触法线，用于滚动效果
    a.cnx += nx; a.cny += ny; a.touching = true;
    b.cnx -= nx; b.cny -= ny; b.touching = true;

    // 法向冲量
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn > 0) return;
    const e = (-vn > REST_THRESHOLD) ? RESTITUTION : 0;
    const jn = -(1 + e) * vn / invSum;
    a.vx -= jn * nx * a.invMass; a.vy -= jn * ny * a.invMass;
    b.vx += jn * nx * b.invMass; b.vy += jn * ny * b.invMass;
    // 视觉弹性：沿接触法线方向挤一下（a 被推向 -n，b 被推向 +n）
    addImpact(a, -nx, -ny, jn * a.invMass);
    addImpact(b, nx, ny, jn * b.invMass);

    // 切向摩擦（让果实能停下、能相互带动）
    const tx = -ny, ty = nx;
    const vt = rvx * tx + rvy * ty;
    let jt = -vt / invSum;
    const maxF = FRICTION * jn;
    if (jt > maxF) jt = maxF; else if (jt < -maxF) jt = -maxF;
    a.vx -= jt * tx * a.invMass; a.vy -= jt * ty * a.invMass;
    b.vx += jt * tx * b.invMass; b.vy += jt * ty * b.invMass;
  }

  // ---- 滚动：根据接触面把线速度转换成角速度（视觉上的“滚起来”） ----
  function updateRolling(b, h) {
    if (!b.touching) { b.omega *= Math.max(0, 1 - 3 * h); return; }
    const len = Math.hypot(b.cnx, b.cny);
    if (len < 1e-4) return;
    const nx = b.cnx / len, ny = b.cny / len;      // 球心 -> 接触点
    const target = (b.vx * ny - b.vy * nx) / b.r;  // 纯滚动对应的角速度
    const k = Math.min(1, 12 * h);
    b.omega += (target - b.omega) * k;
  }

  // ---- 静止判定：慢下来时额外阻尼，堆叠更稳定 ----
  function updateRest(b, h) {
    const sp = Math.hypot(b.vx, b.vy);
    if (sp < REST_SPEED && Math.abs(b.omega) < 1.6 && b.touching) b.restT += h;
    else b.restT = 0;
  }

  // ---- 合成 ----
  function processMerges() {
    if (!mergeQueue.length) return;
    const list = mergeQueue;
    mergeQueue = [];
    for (let i = 0; i < list.length; i++) {
      const a = list[i][0], b = list[i][1];
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;

      if (a.level >= MAX_LEVEL) {
        // 两个西瓜 → 双双消失 + 大额奖励
        addScore(BONUS_WATERMELON, cx, cy);
        burst(cx, cy, FRUITS[MAX_LEVEL].c, 26, 1.6);
        ripples.push({ x: cx, y: cy, r: FRUITS[MAX_LEVEL].r * 0.7, max: FRUITS[MAX_LEVEL].r * 2.4, life: 1, color: FRUITS[MAX_LEVEL].c });
        floats.push({ x: cx, y: cy - 18, text: '西瓜消除!', life: 1, big: true, color: '#ff7fa8' });
        Sound.play('boom');
        continue;
      }

      const lv = a.level + 1;
      const nb = makeBall(cx, cy, lv,
        (a.vx + b.vx) * 0.5,
        (a.vy + b.vy) * 0.5 - 36);
      nb.angle = (a.angle + b.angle) * 0.5;
      nb.omega = (a.omega + b.omega) * 0.5;
      nb.pop = 1;
      nb.glow = 1;
      nb.age = 1;                     // 合成后的果实立即参与危险判定
      balls.push(nb);
      if (lv > maxLevel) maxLevel = lv;

      addScore(POINTS[lv], cx, cy);
      burst(cx, cy, FRUITS[lv].c, 9 + lv, 1);
      ripples.push({ x: cx, y: cy, r: nb.r * 0.45, max: nb.r * 1.9, life: 1, color: FRUITS[lv].c });
      Sound.play('merge', lv);
    }
    balls = balls.filter(b => !b.dead);
  }

  // ---- 单步物理 ----
  // allowMerge=false 时只做运动与碰撞，不再合成（用于结束后的余韵动画，避免继续加分）
  function physicsStep(h, allowMerge) {
    const canMerge = allowMerge !== false;
    // 积分
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      if (b.dead) continue;
      b.vy += GRAVITY * h;
      const drag = Math.max(0, 1 - AIR_DRAG * h);
      b.vx *= drag; b.vy *= drag;
      if (b.restT > 0.22) {              // 已静止：强阻尼消除抖动
        const d = Math.max(0, 1 - 7 * h);
        b.vx *= d; b.vy *= d;
      }
      b.x += b.vx * h;
      b.y += b.vy * h;
      // 速度上限：杜绝极端情况下穿透
      const sp2 = b.vx * b.vx + b.vy * b.vy;
      if (sp2 > MAX_SPEED * MAX_SPEED) {
        const k = MAX_SPEED / Math.sqrt(sp2);
        b.vx *= k; b.vy *= k;
      }
      b.angle += b.omega * h;
      b.omega *= Math.max(0, 1 - ANGULAR_DAMP * h);
      b.age += h;
      if (b.pop > 0) b.pop = Math.max(0, b.pop - h * 3.2);
      if (b.glow > 0) b.glow = Math.max(0, b.glow - h * 2.2);
      if (b.squash > 0) b.squash = Math.max(0, b.squash - h * SQUASH_SPEED);
      b.cnx = 0; b.cny = 0; b.touching = false;
    }
    // 约束求解
    for (let it = 0; it < SOLVER_ITER; it++) {
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (!b.dead) collideWalls(b);
      }
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        if (a.dead) continue;
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j];
          if (b.dead) continue;
          collidePair(a, b, canMerge && it === 0);
        }
      }
      // 每轮最后再投影一次墙壁：位置修正可能把贴墙的果实推出边界
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (!b.dead) collideWalls(b);
      }
    }
    processMerges();

    for (let i = 0; i < balls.length; i++) {
      updateRolling(balls[i], h);
      updateRest(balls[i], h);
    }
  }

  /* ============================================================
     6. 游戏状态
     ============================================================ */
  let state = 'playing';          // playing | over
  let score = 0;
  let best = parseInt(store.get(KEY_BEST, '0'), 10) || 0;
  let pendingLevel = randLevel(); // 当前待掉落的果实
  let nextLevel = randLevel();    // 下一个
  let aimX = W / 2;
  let cooldown = 0;
  let dangerT = 0;
  let overT = 0;                  // 结束后余韵动画已播放的时长
  let newRecord = false;          // 本局是否刷新了最高分
  let dropTimer = 0;              // 用于瞄准虚线的轻微动画
  let badgeDim = false;           // 「下一个」徽章是否淡出
  let maxLevel = 0;               // 本局合成出的最高等级（结算面板展示）

  const $ = id => document.getElementById(id);
  const scoreValue = $('scoreValue');
  const bestValue = $('bestValue');
  const nextSprite = $('nextSprite');
  const hint = $('hint');
  const overlay = $('gameover');
  const finalScore = $('finalScore');
  const recordLine = $('recordLine');
  const overSprite = $('overSprite');
  const soundBtn = $('soundBtn');
  const badge = document.querySelector('.badge');
  const chainEl = $('chain');

  function syncBest() { bestValue.textContent = best; }
  function refreshNext() {
    const f = FRUITS[nextLevel];
    nextSprite.src = spriteURL(nextLevel);
    nextSprite.alt = f.n;
    nextSprite.classList.remove('pop');
    void nextSprite.offsetWidth;
    nextSprite.classList.add('pop');
  }
  function addScore(n, x, y) {
    score += n;
    scoreValue.textContent = score;
    scoreValue.classList.remove('bump'); void scoreValue.offsetWidth; scoreValue.classList.add('bump');
    if (score > best) { best = score; newRecord = true; store.set(KEY_BEST, String(best)); syncBest(); }
    if (typeof x === 'number') {
      // 轻微错位，避免同一瞬间多个飘分文字完全叠在一起
      floats.push({
        x: clamp(x + rand(-12, 12), 34, W - 34),
        y: clamp(y + rand(-8, 4), DEATH_Y + 26, H - 30),
        text: '+' + n, life: 1, color: '#f2889f'
      });
    }
  }

  function burst(x, y, color, count, power) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU), sp = rand(60, 240) * power;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        r: rand(2.4, 5.6) * (1 + power * 0.25),
        life: 1, decay: rand(0.9, 1.7), color
      });
    }
  }

  function beginGame() {
    balls = [];
    mergeQueue = [];
    particles = [];
    ripples = [];
    floats = [];
    score = 0;
    dangerT = 0;
    cooldown = 0;
    newRecord = false;
    overT = 0;
    acc = 0;
    dropTimer = 0;
    badgeDim = false;
    badge.classList.remove('dim');
    maxLevel = 0;
    state = 'playing';
    pendingLevel = randLevel();
    nextLevel = randLevel();
    aimX = W / 2;
    scoreValue.textContent = '0';
    overlay.classList.remove('show');
    hint.classList.remove('hide');
    refreshNext();
  }

  function gameOver() {
    if (state === 'over') return;
    state = 'over';
    finalScore.textContent = score;
    // 结算面板展示本局合出的最高等级角色
    overSprite.src = spriteURL(maxLevel);
    overSprite.alt = FRUITS[maxLevel].n;
    recordLine.textContent = newRecord ? '🎉 新纪录！' : '历史最高 ' + best;
    overlay.classList.add('show');
    stage.classList.add('shake');
    setTimeout(() => stage.classList.remove('shake'), 560);
    Sound.play('over');
  }

  function checkDanger(h) {
    if (state !== 'playing') return;
    let danger = false;
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      if (b.dead || b.age < GRACE) continue;
      if (b.y - b.r < DEATH_Y) {
        const sp = Math.hypot(b.vx, b.vy);
        if (sp < 230) { danger = true; break; }
      }
    }
    if (danger) dangerT += h;
    else dangerT = Math.max(0, dangerT - h * 1.8);
    if (dangerT >= DANGER_LIMIT) gameOver();
  }

  /* ============================================================
     7. 交互
     ============================================================ */
  // 当前待掉落果实的可放置区间（随半径变化）
  function aimLimits() {
    const r = FRUITS[pendingLevel].r;
    return { min: r + 2, max: W - r - 2 };
  }

  // 按逻辑坐标设定落点（内部一律用逻辑坐标，只有事件入口做换算）
  function aimTo(x) {
    const lim = aimLimits();
    aimX = clamp(x, lim.min, lim.max);
  }
  // 浏览器坐标 -> 逻辑坐标
  function aimToClient(clientX) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    aimTo((clientX - rect.left) / rect.width * W);
  }

  function drop() {
    if (state !== 'playing' || cooldown > 0) return;
    const f = FRUITS[pendingLevel];
    const lim = aimLimits();
    const x = clamp(aimX, lim.min, lim.max);
    const b = makeBall(x, f.r + DROP_PAD, pendingLevel, 0, 130);
    b.angle = 0;
    balls.push(b);
    pendingLevel = nextLevel;
    nextLevel = randLevel();
    cooldown = DROP_COOLDOWN;
    refreshNext();
    hint.classList.add('hide');
    Sound.play('drop');
  }

  stage.addEventListener('pointermove', e => { aimToClient(e.clientX); }, { passive: true });
  stage.addEventListener('pointerdown', e => {
    // 只响应主指针的左键：右键/中键/触控板双指点按不应掉落果实
    if (e.button !== 0 || e.isPrimary === false) return;
    Sound.unlock();
    if (state === 'over') return;
    aimToClient(e.clientX);
    drop();
    if (e.cancelable) e.preventDefault();
  });
  // 触屏兜底（部分老浏览器没有 PointerEvent）
  if (!window.PointerEvent) {
    stage.addEventListener('touchmove', e => { if (e.touches.length === 1) aimToClient(e.touches[0].clientX); }, { passive: true });
    stage.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      Sound.unlock();
      if (state === 'over') return;
      aimToClient(e.touches[0].clientX);
      drop();
    }, { passive: true });
  }
  stage.addEventListener('contextmenu', e => e.preventDefault());
  stage.addEventListener('dragstart', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    const step = 16;
    const lim = aimLimits();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      aimX = clamp(aimX - step, lim.min, lim.max); e.preventDefault();
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      aimX = clamp(aimX + step, lim.min, lim.max); e.preventDefault();
    } else if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') {
      Sound.unlock();
      if (state === 'over') beginGame(); else drop();
      e.preventDefault();
    } else if (e.key === 'r' || e.key === 'R') {
      beginGame();
    } else if (e.key === 'm' || e.key === 'M') {
      toggleSound();
    }
  });

  function toggleSound() {
    const muted = Sound.toggle();
    soundBtn.textContent = muted ? '🔇' : '🔊';
    soundBtn.classList.toggle('off', muted);
  }
  soundBtn.addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
  $('restartBtn').addEventListener('click', e => { e.stopPropagation(); beginGame(); });
  $('againBtn').addEventListener('click', () => beginGame());

  /* ============================================================
     8. 渲染
     ============================================================ */
  // 背景是静态的：绘制到离屏 canvas 后缓存，避免每帧重复创建渐变 + 约 260 次 arc
  function paintBackdrop(c) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#fffdf7');
    g.addColorStop(0.45, '#fff6fb');
    g.addColorStop(1, '#eef8ff');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    // 淡淡的圆点纹理
    c.fillStyle = 'rgba(176,166,200,0.13)';
    for (let y = 16; y < H - 8; y += 30) {
      for (let x = 16; x < W - 8; x += 30) {
        c.beginPath();
        c.arc(x + ((y / 30) % 2 ? 15 : 0), y, 1.3, 0, TAU);
        c.fill();
      }
    }

    // 两侧玻璃感
    const lg = c.createLinearGradient(0, 0, 26, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0.75)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = lg;
    c.fillRect(0, 0, 26, H);
    const rg = c.createLinearGradient(W, 0, W - 26, 0);
    rg.addColorStop(0, 'rgba(255,255,255,0.75)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = rg;
    c.fillRect(W - 26, 0, 26, H);

    // 地面
    const fg = c.createLinearGradient(0, H - 52, 0, H);
    fg.addColorStop(0, 'rgba(150,190,220,0)');
    fg.addColorStop(1, 'rgba(150,190,220,0.18)');
    c.fillStyle = fg;
    c.fillRect(0, H - 52, W, 52);
    c.strokeStyle = 'rgba(146,186,216,0.55)';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(0, H - 1.5);
    c.lineTo(W, H - 1.5);
    c.stroke();
  }

  function drawBackdrop() {
    if (!bgCache || bgCache.scale !== renderScale) {
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(W * renderScale));
      cv.height = Math.max(1, Math.round(H * renderScale));
      const c2 = cv.getContext('2d');
      c2.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
      paintBackdrop(c2);
      bgCache = { canvas: cv, scale: renderScale };
    }
    ctx.drawImage(bgCache.canvas, 0, 0, W, H);
  }

  function drawDeathLine() {
    const t = clamp(dangerT / DANGER_LIMIT, 0, 1);
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 210);
    ctx.save();
    if (t > 0.02) {
      // 越线警告：红色光带
      const g = ctx.createLinearGradient(0, DEATH_Y - 26, 0, DEATH_Y + 30);
      g.addColorStop(0, 'rgba(255,86,120,0)');
      g.addColorStop(0.5, 'rgba(255,86,120,' + (0.10 + 0.14 * t * (0.6 + 0.4 * pulse)) + ')');
      g.addColorStop(1, 'rgba(255,86,120,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, DEATH_Y - 26, W, 56);
    }
    ctx.setLineDash([10, 9]);
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.strokeStyle = t > 0.02
      ? 'rgba(255,72,110,' + (0.5 + 0.5 * t * (0.55 + 0.45 * pulse)) + ')'
      : 'rgba(168,158,196,0.5)';
    ctx.beginPath();
    ctx.moveTo(7, DEATH_Y);
    ctx.lineTo(W - 7, DEATH_Y);
    ctx.stroke();
    ctx.restore();

    // 危险提示文字
    if (t > 0.25) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (t - 0.25) * 3) * (0.65 + 0.35 * pulse);
      ctx.fillStyle = '#f2476f';
      ctx.font = '700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText('危险！', 10, DEATH_Y - 6);
      ctx.restore();
    }
  }

  // 绘制贴纸：碰撞箱仍是圆（半径 r），贴纸外接方框 = 2r*FIT 把圆“盖住”
  // sq/sqx/sqy：撞击挤压的强度与方向（沿法线压扁、垂直方向拉长，形成回弹感）
  function drawFruit(x, y, r, level, angle, scale, sq, sqx, sqy) {
    const s = scale || 1;
    const size = r * 2 * SPRITE_FIT;
    ctx.save();
    ctx.translate(x, y);

    // 落地软阴影（不参与挤压）
    ctx.beginPath();
    ctx.ellipse(0, r * 0.62, r * 0.72, r * 0.24, 0, 0, TAU);
    ctx.fillStyle = 'rgba(122,96,140,0.13)';
    ctx.fill();

    ctx.scale(s, s);
    if (sq > 0) {
      const na = Math.atan2(sqy, sqx);
      const k = SQUASH_GAIN * sq;
      ctx.rotate(na);
      ctx.scale(1 - k, 1 + k);
      ctx.rotate(-na);
    }
    const im = spriteImgs[level];
    if (spriteReady(level)) {
      const a = displayAngle(angle);
      if (a) ctx.rotate(a);
      ctx.drawImage(im, -size / 2, -size / 2, size, size);
    } else {
      // 图片还没解码完：先画一个柔和占位块
      const rad = Math.min(size * 0.42, r * 0.6);
      roundRect(-size / 2, -size / 2, size, size, rad);
      ctx.fillStyle = FRUITS[level].l;
      ctx.fill();
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function drawBall(b) {
    const pop = b.pop > 0 ? 1 + 0.16 * Math.sin(b.pop * Math.PI) : 1;
    if (b.glow > 0) {
      ctx.save();
      ctx.globalAlpha = b.glow * 0.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * (1.05 + (1 - b.glow) * 0.5), 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fill();
      ctx.restore();
    }
    drawFruit(b.x, b.y, b.r, b.level, b.angle, pop, b.squash, b.snx, b.sny);
  }

  function drawAim() {
    if (state !== 'playing') return;
    const f = FRUITS[pendingLevel];
    const lim = aimLimits();
    const x = clamp(aimX, lim.min, lim.max);
    const ready = cooldown <= 0;
    const y = f.r + DROP_PAD + (ready ? Math.sin(dropTimer * 3.2) * 2.2 : -4);

    // 待掉落果实飘到右上角时，让「下一个」徽章淡出，避免互相遮挡
    const dim = (x + f.r) > W - 134;
    if (dim !== badgeDim) { badgeDim = dim; badge.classList.toggle('dim', dim); }

    ctx.save();
    // 瞄准虚线
    ctx.globalAlpha = ready ? 0.42 : 0.14;
    ctx.setLineDash([7, 11]);
    ctx.lineDashOffset = -dropTimer * 26;
    ctx.lineWidth = 2;
    ctx.strokeStyle = f.c;
    ctx.beginPath();
    ctx.moveTo(x, f.r * 2 + 10);
    ctx.lineTo(x, H - 14);
    ctx.stroke();
    ctx.restore();

    // 待掉落果实（冷却时半透明，表示装填中）
    ctx.save();
    ctx.globalAlpha = ready ? 1 : 0.3;
    drawFruit(x, y, f.r, pendingLevel, 0, ready ? 1 : 0.86);
    ctx.restore();
  }

  function drawEffects() {
    // 波纹
    for (let i = 0; i < ripples.length; i++) {
      const rp = ripples[i];
      ctx.save();
      ctx.globalAlpha = rp.life * 0.55;
      ctx.lineWidth = 3 * rp.life + 1;
      ctx.strokeStyle = rp.color;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
    // 粒子
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + p.life * 0.6), 0, TAU);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.restore();
    }
    // 飘分
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < floats.length; i++) {
      const fl = floats[i];
      ctx.save();
      ctx.globalAlpha = Math.min(1, fl.life * 1.6);
      ctx.font = '800 ' + (fl.big ? 20 : 17) + 'px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(255,255,255,0.92)';
      ctx.strokeText(fl.text, fl.x, fl.y);
      ctx.fillStyle = fl.color || '#f2889f';
      ctx.fillText(fl.text, fl.x, fl.y);
      ctx.restore();
    }
  }

  // 按 y 从下往上画：贴纸比碰撞圆略大，重叠时“压在上面”的更靠前，观感更自然
  const drawOrder = [];
  function render(dt) {
    ctx.clearRect(0, 0, W, H);
    drawBackdrop();
    drawDeathLine();
    drawOrder.length = 0;
    for (let i = 0; i < balls.length; i++) drawOrder.push(balls[i]);
    drawOrder.sort((a, b) => b.y - a.y);
    for (let i = 0; i < drawOrder.length; i++) drawBall(drawOrder[i]);
    drawAim();
    drawEffects();
  }

  function updateEffects(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 1500 * dt;
      p.vx *= (1 - 1.6 * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0 || p.y > H + 20) particles.splice(i, 1);
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += (rp.max - rp.r) * Math.min(1, 7 * dt);
      rp.life -= 2.1 * dt;
      if (rp.life <= 0) ripples.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const fl = floats[i];
      fl.y -= 34 * dt;
      fl.life -= 0.95 * dt;
      if (fl.life <= 0) floats.splice(i, 1);
    }
  }

  /* ============================================================
     9. 主循环
     ============================================================ */
  let acc = 0, last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) { last = ts; return; }
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;          // 切后台回来不要“穿越”
    if (dt < 0) dt = 0;

    dropTimer += dt;
    if (cooldown > 0) cooldown = Math.max(0, cooldown - dt);

    if (state === 'playing') {
      acc += dt;
      let steps = 0;
      while (acc >= DT && steps < MAX_STEPS) {
        physicsStep(DT);
        checkDanger(DT);
        acc -= DT;
        steps++;
        if (state !== 'playing') break;
      }
      if (acc > DT * MAX_STEPS) acc = 0;
    } else {
      acc = 0;
      // 结束后让残留果实再动一会儿（不再合成加分），之后彻底停下省电
      if (overT < OVER_SETTLE) {
        overT += dt;
        for (let i = 0; i < 3; i++) physicsStep(DT, false);
      }
    }

    updateEffects(dt);
    render(dt);
  }

  /* ============================================================
     10. 初始化
     ============================================================ */
  chainEl.innerHTML = FRUITS
    .map(f => '<img src="' + spriteURL(FRUITS.indexOf(f)) + '" alt="' + f.n + '" title="' + f.n + '" />')
    .join('<span class="arrow">›</span>');

  soundBtn.textContent = Sound.isMuted() ? '🔇' : '🔊';
  soundBtn.classList.toggle('off', Sound.isMuted());
  syncBest();
  refreshNext();
  resize();

  // 调试 / 自动化测试接口（不影响正常游玩）
  window.__suika = {
    version: '1.0.0',
    get state() { return state; },
    get score() { return score; },
    get best() { return best; },
    get balls() { return balls.map(b => ({ x: b.x, y: b.y, r: b.r, level: b.level, vx: b.vx, vy: b.vy, sq: +b.squash.toFixed(2) })); },
    get pending() { return pendingLevel; },
    get maxLevel() { return maxLevel; },
    get spritesReady() { return FRUITS.map((f, i) => spriteReady(i)); },
    get sound() { return Sound.sampleState(); },
    get effects() { return { particles: particles.length, ripples: ripples.length, floats: floats.length }; },
    get config() { return { W, H, DEATH_Y, GRAVITY, DT, radii: FRUITS.map(f => f.r), levels: FRUITS.length }; },
    spawn(level, x, y) { const b = makeBall(x, y, level); b.age = 1; balls.push(b); return balls.length; },
    aimAt(x) { aimTo(x); },
    drop,
    step(n) {
      // 与主循环保持一致：结束后只跑运动与碰撞，不再合成加分
      for (let i = 0; i < (n || 1); i++) { physicsStep(DT, state === 'playing'); checkDanger(DT); }
      return balls.length;
    },
    restart: beginGame,
    forceDanger(t) { dangerT = t === undefined ? DANGER_LIMIT : t; }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
